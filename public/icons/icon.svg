<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a161b"/>
      <stop offset="100%" style="stop-color:#030a0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0da97"/>
      <stop offset="100%" style="stop-color:#cf9c34"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Two overlapping arcs — gold ring + teal crescent, echoing the brand mark -->
  <circle cx="248" cy="256" r="140" fill="none" stroke="url(#gold)" stroke-width="34"/>
  <path d="M 320 130 A 140 140 0 1 1 320 382" fill="none" stroke="#0b7f79" stroke-width="34" stroke-linecap="round"/>
</svg>
